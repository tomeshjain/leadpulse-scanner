name: Build Wispr Flow Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-keyboard-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Wispr Flow Keyboard APK with Gradle
        working-directory: wispr-flow-keyboard
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            ERROR_OUTPUT=$(grep -C 3 -i "error:" build.log | head -n 60)
            if [ -z "$ERROR_OUTPUT" ]; then
              ERROR_OUTPUT=$(tail -n 60 build.log)
            fi
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$ERROR_OUTPUT" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Keyboard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find wispr-flow-keyboard -name "*.apk" -ls
          APK_FILE=$(find wispr-flow-keyboard -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find wispr-flow-keyboard/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./WisprFlowKeyboard.apk"
          cp "$APK_FILE" ./WisprFlowKeyboard.apk
          ls -lh ./WisprFlowKeyboard.apk

      - name: Upload Keyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WisprFlowKeyboard-APK
          path: ./WisprFlowKeyboard.apk

      - name: Create or Update GitHub Release (Wispr Keyboard v1.1.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: wispr-keyboard-v1.1.0
          name: "Wispr Flow - Native Android AI Keyboard Extension (v1.1.0)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## ⌨️ Wispr Flow - Native Android AI Keyboard Extension (v1.1.0)

            **Professional Extended Keyboard Facility for Android with AI Voice Dictation, Smart Predictions, and Text Expansion.**

            ### 🚀 New & Upgraded Features:
            - **🎙️ Dedicated Separate Microphone Button**: Voice dictation now has its own dedicated mic button in both the top toolbar and bottom key row. Normal spacebar functions strictly as a clean, responsive spacebar!
            - **🧠 Smart Suggestions & Collocation Learning**: Learns your typing habits dynamically and predicts next collocated words (e.g. *Good ➔ Morning, Afternoon, Luck*; *Thank ➔ you so much*).
            - **⚡ Text Shortcuts & Custom Expansions**:
              - Default built-in shortcuts: `GM` ➔ `Good Morning`, `GE` ➔ `Good Evening`, `TY` ➔ `Thank you very much`, `BRB` ➔ `Be right back`, `OMW` ➔ `On my way!`, `NP` ➔ `No problem!`, etc.
              - **Custom Shortcuts Manager**: Add, edit, or delete any custom shortcut from the Settings screen!
            - **😊 Categorized Emojis Panel**: Over 150+ categorized emojis (Smileys, Gestures, Hearts, Activities, Food, Work) with 1-tap insertion.
            - **🎞️ GIFs & Reaction Stickers**: Quick reaction GIFs and kaomoji stickers (`(づ｡◕‿‿◕｡)づ`, `¯\_(ツ)_/¯`, `(╯°□°)╯︵ ┻━┻`).
            - **📋 Clipboard History & 📌 Pinning Favorites**: Stores recent clipboard history with 1-tap pasting and permanent pin favorites for frequent addresses, messages, or notes.
            - **⇪ Double-Tap Caps Lock**: Single tap for Shift, double tap for illuminated permanent Caps Lock.
            - **⚙️ Instant Settings Launcher**: 1-tap access to configure Gemini API Key, select AI Model (`gemini-2.0-flash`, `gemini-1.5-flash`, etc.), and grant microphone permissions.
            - **🎙️ Microphone Permission Checker**: In-app runtime permission check to ensure flawless voice dictation out of the box.

            ### 📲 Quick Setup:
            1. Download and install **`WisprFlowKeyboard.apk`** below.
            2. Open the **Wispr Flow** app.
            3. Tap **"1. Enable Wispr Flow in Settings"** and toggle on the keyboard.
            4. Tap **"2. Switch Active Keyboard"** and select **Wispr Flow**.
            5. Tap **"Grant Microphone Permission"** so speech dictation works smoothly.
            6. Paste your **Gemini API Key** (optional, offline rule-based polishing works immediately if omitted).
          files: |
            ./WisprFlowKeyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
