name: Build Wispr Flow Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-keyboard-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Wispr Flow Keyboard APK with Gradle
        working-directory: wispr-flow-keyboard
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(tail -n 80 build.log)" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Keyboard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find wispr-flow-keyboard -name "*.apk" -ls
          APK_FILE=$(find wispr-flow-keyboard -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find wispr-flow-keyboard/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./WisprFlowKeyboard.apk"
          cp "$APK_FILE" ./WisprFlowKeyboard.apk
          ls -lh ./WisprFlowKeyboard.apk

      - name: Upload Keyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WisprFlowKeyboard-APK
          path: ./WisprFlowKeyboard.apk

      - name: Create or Update GitHub Release (Wispr Keyboard v1.0.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: wispr-keyboard-v1.0.0
          name: "Wispr Flow - Native Android AI Keyboard Extension (v1.0.0)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## ⌨️ Wispr Flow - Native Android AI Keyboard Extension (v1.0.0)

            **Extended Keyboard Facility for Android with Integrated Voice Dictation & Gemini AI Polishing.**
            
            Replaces mobile keyboard typing across your entire phone (WhatsApp, Gmail, Chrome, Slack, Notes, etc.).

            ### 🚀 Features & Capabilities:
            - **100% Pure Native Android IME Keyboard**: No WebView or hybrid wrapper. Launches instantly and functions smoothly as an on-screen keyboard extension.
            - **Glowing Flow Voice Spacebar**: Tap the central mic spacebar to dictate speech in real-time.
            - **Google Gemini API Key Setup**: In Settings (or directly via the ⚙️ keyboard button), enter your Gemini API Key.
            - **Select AI Model to Access**:
              - `gemini-2.0-flash` (Recommended: Fastest & sub-second response)
              - `gemini-1.5-flash`
              - `gemini-1.5-pro`
              - `gemini-2.0-flash-lite`
              - Dynamic model fetch from your API key!
            - **7 Flow Transformation Modes**:
              - ✨ **Smart Polish**: Strips "um/uh", fixes stutters, adds natural punctuation.
              - 💬 **Casual Chat**: Natural, friendly, light emojis for WhatsApp and texting.
              - ✉️ **Executive Email**: Formal greeting, paragraphs, and professional sign-off.
              - 📝 **Structured Notes**: Markdown bullets and action items.
              - ⚡ **Raw Dictation**: 1:1 exact spoken words.
              - 💻 **Code & Dev**: camelCase formatting, SQL uppercase, markdown blocks.
              - 🪄 **AI Action Prompt**: Executes spoken instructions directly.
            - **Offline Polisher Fallback**: Works immediately even without an API key using built-in rule-based formatting.
            - **Direct Input Injection**: Directly commits polished text into whatever app you are currently typing in (`InputConnection.commitText`).

            ### 📲 Setup Instructions:
            1. Download and install **`WisprFlowKeyboard.apk`** below.
            2. Open the **Wispr Flow Keyboard** app icon on your phone.
            3. Tap **"1. Enable Wispr Flow in Settings"** and toggle on the keyboard.
            4. Tap **"2. Switch Active Keyboard"** and select **Wispr Flow**.
            5. Enter your **Gemini API Key**, choose your preferred **AI Model**, and test it in the test box!
          files: |
            ./WisprFlowKeyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
