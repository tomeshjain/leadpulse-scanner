name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(tail -n 80 build.log)" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Output
        run: |
          echo "=== Locating APK Files ==="
          find . -name "*.apk" -ls
          APK_FILE=$(find . -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find android/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./WisprFlow.apk"
          cp "$APK_FILE" ./WisprFlow.apk
          ls -lh ./WisprFlow.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WisprFlow-Android-APK
          path: ./WisprFlow.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: wispr-flow-v1.0.0
          name: "Wispr Flow - AI Voice Keyboard & Universal Dictation (v1.0.0)"
          draft: false
          prerelease: false
          body: |
            ## 🎙️ Wispr Flow - Universal AI Voice Keyboard & Dictation (Android APK)

            Wispr Flow replaces typing across your entire mobile phone with ultra-low latency AI voice recognition and smart formatting.

            ### 🚀 What's Inside:
            - **Sub-Second Low-Latency Voice Engine**: Real-time streaming voice recognition (<20ms perceived feedback) + 60fps dynamic liquid audio visualizer.
            - **Google Gemini 2.0 Flash Flow Engine**: Ultra-fast AI voice polishing that strips filler words ("um", "uh", "like", "you know"), fixes stutters, and infers natural punctuation.
            - **Multi-Flow Style Presets**:
              - 💬 **Casual Chat**: Natural, friendly, concise, with emojis for WhatsApp, Telegram, Slack DMs.
              - ✉️ **Executive Email**: Structured professional emails with greetings, paragraphs, and sign-offs for Gmail & Outlook.
              - 📝 **Structured Notes**: Markdown headings, bullet points, and checkbox action items for Notion and Notes.
              - ⚡ **Raw Dictation**: 1:1 exact word transcription with precision punctuation.
              - 💻 **Code & Dev**: Formats camelCase variables, SQL queries, and terminal commands.
              - 🪄 **Voice Prompt / Action**: Speak instructions to the AI (e.g. "Draft polite reply declining meeting").
            - **📱 Replaces Typing Across ALL Mobile Apps**:
              - **Floating Voice Overlay HUD**: Draggable microphone pill that hovers on top of WhatsApp, Chrome, Slack, etc., auto-copying polished text to your clipboard.
              - **Android Custom Keyboard (IME)**: Custom on-screen keyboard with a dedicated **Flow AI Mic Spacebar** that directly injects text into any input field.
            - **📖 Personal Vocabulary & Custom Dictionary**: Teach the AI your specific acronyms, company jargon, and colleague names so they are never misspelled.
            - **⚡ 3.4x Faster Than Typing**: Track your words per minute (140+ WPM) and total time saved vs mobile typing.
          files: |
            ./WisprFlow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
