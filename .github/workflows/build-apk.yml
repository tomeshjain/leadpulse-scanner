name: Build Wispr Flow Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-keyboard-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Wispr Flow Keyboard APK with Gradle
        working-directory: wispr-flow-keyboard
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            ERROR_OUTPUT=$(grep -C 3 -i "error:" build.log | head -n 60)
            if [ -z "$ERROR_OUTPUT" ]; then
              ERROR_OUTPUT=$(tail -n 60 build.log)
            fi
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$ERROR_OUTPUT" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Keyboard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find wispr-flow-keyboard -name "*.apk" -ls
          APK_FILE=$(find wispr-flow-keyboard -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find wispr-flow-keyboard/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./WisprFlowKeyboard.apk"
          cp "$APK_FILE" ./WisprFlowKeyboard.apk
          ls -lh ./WisprFlowKeyboard.apk

      - name: Upload Keyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WisprFlowKeyboard-APK
          path: ./WisprFlowKeyboard.apk

      - name: Create or Update GitHub Release (Wispr Keyboard v1.2.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: wispr-keyboard-v1.2.0
          name: "Wispr Flow - Native Android AI Keyboard Extension (v1.2.0)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## ⌨️ Wispr Flow - Native Android AI Keyboard Extension (v1.2.0)

            **Professional Extended Keyboard Facility for Android with Continuous Digits Dictation, Dedicated Suggestion & Action Toolbars, Number Row, and Selected Text Backspace Fix.**

            ### 🚀 New & Upgraded Features:
            - **🛠️ Backspace Selected Text Fix**: Correctly removes selected/highlighted text across any app and provides smooth repeating backspace.
            - **🔢 Continuous Spoken Digits**: Formats spoken numbers, OTPs, PINs, phone numbers, and codes as continuous digits without spaces in between (e.g. `987654` instead of `9 8 7 6 5 4`).
            - **✨ Dedicated Top Suggestion Row**: Clean full-width top strip with large touch targets for next-word predictions, learned collocations, and instant 1-tap paste chip.
            - **⚡ Dedicated Quick Action Toolbar**: Second row with quick-access buttons for 🎙️ Voice Dictate, 😊 Emojis, 🎞️ GIFs, 📋 Clipboard, ⚡ Shortcuts, ✨ AI Flow Mode, and ⚙️ Settings.
            - **🔢 Dedicated Number Row (1-0)**: Seamless row of numbers directly above QWERTY letters for faster typing without switching layouts.
            - **↔️ Spacebar Cursor Scrubbing**: Slide your finger across the spacebar to glide the cursor precisely through text.
            - **📋 Real-Time Clipboard Monitor**: Automatically tracks copied text for quick pasting and permanent pinned favorites.
            - **🎙️ Dedicated Separate Microphone Button**: High-visibility voice button with live listening waveform pulse.
            - **⚡ Shortcuts Facility**: Auto-expands abbreviations like `GM` ➔ `Good Morning`, `TY` ➔ `Thank you very much`.

            ### 📲 Quick Setup:
            1. Download and install **`WisprFlowKeyboard.apk`** below.
            2. Open the **Wispr Flow** app.
            3. Tap **"1. Enable Wispr Flow in Settings"** and toggle on the keyboard.
            4. Tap **"2. Switch Active Keyboard"** and select **Wispr Flow**.
            5. Tap **"Grant Microphone Permission"** so speech dictation works smoothly.
            6. Paste your **Gemini API Key** (optional, offline rule-based polishing works immediately if omitted).
          files: |
            ./WisprFlowKeyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
