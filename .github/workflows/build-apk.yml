name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Standard APK with Gradle
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(tail -n 80 build.log)" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Standard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find . -name "*.apk" -ls
          APK_FILE=$(find . -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find android/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./WisprFlow.apk"
          cp "$APK_FILE" ./WisprFlow.apk
          ls -lh ./WisprFlow.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WisprFlow-Standard-APK
          path: ./WisprFlow.apk

      - name: Create or Update GitHub Release (v1.0.1)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: wispr-flow-v1.0.1
          name: "Wispr Flow - Standard Installation APK (v1.0.1)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🎙️ Wispr Flow - Standard Installation APK (v1.0.1)

            **Standard, ready-to-install Android APK with full voice recognition and Gemini AI polishing.**

            ### 🚀 Updates in v1.0.1:
            - **Standard Android Voice Dialog Integration**: Integrated `RecognizerIntent.ACTION_RECOGNIZE_SPEECH` fallback that works on 100% of Android phones with system voice typing.
            - **Android 11+ (API 30+) Package Visibility Queries**: Added `<queries>` declarations in AndroidManifest so Android OS grants voice recognition permissions.
            - **No More Silent Freezes**: All speech errors, timeouts, or permission requests now give immediate visible feedback and reset the UI cleanly.
            - **Live Speech & AI Output Box**: Output card is always visible with live placeholder so you can see your text stream in real time.
            - **Quick Demo Voice Test**: 1-tap testing button to test instant AI formatting without needing microphone access.
            - **System-Wide Replacement**: Floating Voice HUD + Custom Android Keyboard with Flow AI Mic Spacebar.

            ### 📲 Installation Instructions:
            1. Download **`WisprFlow.apk`** below.
            2. If you have an older version installed, uninstall it first to avoid signature conflicts.
            3. Tap the downloaded APK to install. If prompted by Play Protect, tap **"More details"** -> **"Install anyway"**.
            4. Open Wispr Flow, tap the mic, and speak!
          files: |
            ./WisprFlow.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
