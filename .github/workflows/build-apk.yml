name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$(tail -n 80 build.log)" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Output
        run: |
          echo "=== Locating APK Files ==="
          find . -name "*.apk" -ls
          APK_FILE=$(find . -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find android/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./LeadPulse.apk"
          cp "$APK_FILE" ./LeadPulse.apk
          ls -lh ./LeadPulse.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeadPulse-Android-APK
          path: ./LeadPulse.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.0.0
          name: "LeadPulse Enterprise Android App v2.0.0"
          draft: false
          prerelease: false
          body: |
            ## 📱 LeadPulse Enterprise v2.0.0 - Standalone Android APK

            Download `LeadPulse.apk` below and install it directly on your Android phone.

            ### What's New in v2.0.0:
            - **Zero Dummy Data Guarantee**: Clean slate architecture with automatic legacy mock data purger.
            - **Data Retention & Integrity**: Local leads and task database safely persist across all APK updates without data loss.
            - **Distraction-Free Professional UI**: Removed fake phone status bar chrome; ultra-clean, modern UI designed for sales professionals.
            - **Sales Representative Profile**: Capture Employee Name, Corporate Email, Employee ID, and Sales Region. Every scan is stamped with creator attribution.
            - **Organization Intelligence & Alumni Discovery**: Aggregate past work and employers across all leads. Discover which contacts have worked at specific organizations for warm introductions.
            - **Cross-Team Collaboration & Offline Sharing**: Share lead bundles with teammates using shared Workspace Codes or 1-tap JSON database import/export.
            - **Google Gemini Multimodal Vision AI**: Real-time business card entity extraction, career synthesis, and icebreakers.
            - **1-Tap Android Contacts (.vcf)**: Export directly to native Android contacts.
          files: |
            ./LeadPulse.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
