name: Build Wispr Flow Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-keyboard-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Wispr Flow Keyboard APK with Gradle
        working-directory: wispr-flow-keyboard
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            ERROR_OUTPUT=$(grep -C 3 -i "error:" build.log | head -n 60)
            if [ -z "$ERROR_OUTPUT" ]; then
              ERROR_OUTPUT=$(tail -n 60 build.log)
            fi
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$ERROR_OUTPUT" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Keyboard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find wispr-flow-keyboard -name "*.apk" -ls
          APK_FILE=$(find wispr-flow-keyboard -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find wispr-flow-keyboard/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./WisprFlowKeyboard.apk"
          cp "$APK_FILE" ./WisprFlowKeyboard.apk
          ls -lh ./WisprFlowKeyboard.apk

      - name: Upload Keyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WisprFlowKeyboard-APK
          path: ./WisprFlowKeyboard.apk

      - name: Create or Update GitHub Release (Wispr Keyboard v1.3.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: wispr-keyboard-v1.3.0
            name: "Wispr Flow - Native Android AI Keyboard Extension (v1.3.0)"
            draft: false
            prerelease: false
            make_latest: true
            body: |
              ## ⌨️ Wispr Flow - Native Android AI Keyboard Extension (v1.3.0)

              **Professional Extended Keyboard Facility for Android with Contact Card Scanner (AI Vision OCR + Send Image & Text), Real-Time Spelling Suggestions, Clean Layout with Separated Text/Numeric Keyboards, and 6 Gorgeous Dynamic Themes.**

              ### 🚀 New & Upgraded Features:
              - **📇 Business & Contact Card Scanner**:
                - One-tap scanner right in the keyboard action bar (`📇 Scan Card`).
                - Snaps card photo or picks from gallery.
                - Analyzes and extracts Name, Job Title, Organization, Phone numbers, Email, Website, and Address using Gemini Vision AI.
                - **"Send Image & Text"**: Inserts structured formatted text into active chat/field AND delivers card image directly via rich content `commitContent` & clipboard!
              - **⌨️ Separated Text & Numeric Keyboards with 10-Key PIN Numpad**:
                - Text keyboard is now spacious, clean, and separated from numbers (uncluttered QWERTY).
                - `?123` switches to dedicated numbers & symbols row.
                - Dedicated **"123 PIN"** button switches to an oversized 3x4 telephone/calculator style numeric keypad (`1 2 3 / 4 5 6 / 7 8 9 / 0`).
                - Option in Settings to enable permanent number row if desired.
              - **🎙️ Cleaned Voice Layout (No Duplicate Mic Buttons)**:
                - Removed redundant microphone key from the bottom row.
                - High-visibility dedicated `🎙️ Voice` button in the top action toolbar with audio waveform visualizer.
                - Spoken numbers are automatically collapsed into continuous digits (OTPs, PINs, phone numbers without spaces).
              - **✨ Real-Time Spelling Suggestions & Autocorrect**:
                - Real-time typo detection and spelling suggestions in the top predictive strip.
                - Integrated 600+ word dictionary, 75+ common typo replacements (`teh` ➔ `the`, `becuase` ➔ `because`, `recieved` ➔ `received`), and Levenshtein distance candidate matching.
              - **🎨 6 Dynamic Keyboard Themes**:
                - `🎨 Themes` button in keyboard action toolbar opens live theme preview panel.
                - Choose from **Midnight Slate**, **OLED Pure Black**, **Clean Light / Silver**, **Cyberpunk Neon**, **Forest Emerald**, and **Sunset Amber**.
                - Live instant re-theming without reloading the keyboard!

              ### 📲 Quick Setup:
              1. Download and install **`WisprFlowKeyboard.apk`** below.
              2. Open the **Wispr Flow** app.
              3. Tap **"1. Enable Wispr Flow in Settings"** and toggle on the keyboard.
              4. Tap **"2. Switch Active Keyboard"** and select **Wispr Flow**.
              5. Tap **"Grant Microphone Permission"** and camera permission for card scanning.
              6. Configure your **Gemini API Key** in Settings for Gemini Vision card extraction and advanced voice polish.
            files: |
              ./WisprFlowKeyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

