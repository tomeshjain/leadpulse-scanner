name: Build LeadPulse AI Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-keyboard-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build LeadPulse AI Keyboard APK with Gradle
        working-directory: wispr-flow-keyboard
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            ERROR_OUTPUT=$(grep -C 3 -i "error:" build.log | head -n 60)
            if [ -z "$ERROR_OUTPUT" ]; then
              ERROR_OUTPUT=$(tail -n 60 build.log)
            fi
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$ERROR_OUTPUT" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Keyboard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find wispr-flow-keyboard -name "*.apk" -ls
          APK_FILE=$(find wispr-flow-keyboard -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find wispr-flow-keyboard/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./LeadPulseAIKeyboard.apk"
          cp "$APK_FILE" ./LeadPulseAIKeyboard.apk
          cp "$APK_FILE" ./WisprFlowKeyboard.apk
          ls -lh ./LeadPulseAIKeyboard.apk

      - name: Upload Keyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeadPulseAIKeyboard-APK
          path: ./LeadPulseAIKeyboard.apk

      - name: Create or Update GitHub Release (LeadPulse v1.5.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: leadpulse-v1.5.0
            name: "LeadPulse AI Keyboard & Smart Scanner (v1.5.0)"
            draft: false
            prerelease: false
            make_latest: true
            body: |
              ## 🚀 LeadPulse AI Keyboard & Smart Scanner (v1.5.0)

              **Professional Executive AI Keyboard for Android with PulseFlow Voice Dictation, Strict 6-Field LeadPulse Card Scanner, Zero-Touch Automated Contact Saving, Transparent Model Engine Badges, and Pure AI Diagnostics.**

              ### 💎 What's New in v1.5.0:
              - **🌟 Complete Executive Rebranding**:
                - Rebranded to **LeadPulse AI Keyboard** with **PulseFlow Voice Dictation** & **LeadPulse Smart Scanner**.
                - Brand-new commercial 3D soundwave + keycap diamond AI glyph icon rendered across all Android mipmap densities (`mdpi`, `hdpi`, `xhdpi`, `xxhdpi`, `xxxhdpi`).
              - **📇 Strict 6-Field Contact Card Extraction**:
                - Output strictly restricted to: `Name`, `Designation`, `Organization`, `Email`, `Phone Number`, `City`.
                - If any field is missing or not present, it is **omitted completely** (Zero "N/A", "None", or empty lines).
              - **⚡ 100% Automated Silent Contact Saving (Zero Human Intervention)**:
                - Tapping "Save Contact" programmatically inserts details directly into the phone's native address book via Android `ContentResolver.applyBatch` (`ContactsContract.RawContacts` & `ContactsContract.Data`).
                - No confirmation popups, no contact editor screen—saves instantly in the background.
              - **🧠 Multi-Model Fallback Cascade**:
                - Primary (`gemini-2.0-flash`) ➔ Secondary (`gemini-1.5-flash`) ➔ Tertiary (`gemini-1.5-pro`) ➔ Offline Engine.
              - **🟢 Transparent Engine Indicator Badges**:
                - Real-time badges reveal whether `🟢 Pure AI`, `🟡 Fallback AI`, or `⚪ Offline Local Engine` processed your voice dictation or business card, complete with execution latency in milliseconds.
              - **🧪 Dedicated Pure AI & Gemini Live WebSocket Diagnostics**:
                - Test Pure AI Voice Translation (strict no-fallback mode).
                - Test Pure AI Contact Card Extraction with 6-field schema verification.
                - Test Gemini Multimodal Live WebSocket handshake (`wss://generativelanguage.googleapis.com/...`).
                - Dedicated dark monospace diagnostics console.
              - **🎨 Refined Executive UI & Button Color Palette**:
                - Upgraded Settings page buttons to Royal Indigo (`#4f46e5`), crisp white typography, and frosted slate secondary pills.
            files: |
              ./LeadPulseAIKeyboard.apk
              ./WisprFlowKeyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

