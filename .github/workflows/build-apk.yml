name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Gradle
        working-directory: android
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Output
        run: |
          ls -la android/app/build/outputs/apk/debug/
          cp android/app/build/outputs/apk/debug/app-debug.apk ./LeadPulse.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeadPulse-Android-APK
          path: ./LeadPulse.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "LeadPulse Android App v1.0.0"
          draft: false
          prerelease: false
          body: |
            ## 📱 LeadPulse - Standalone Android APK

            Download `LeadPulse.apk` below and install it directly on your Android phone.

            ### What's Inside:
            - **Visiting Card Scanner**: Live camera scanning and gallery photo processing.
            - **AI Extraction & Background Enrichment**: Google Gemini Multimodal Vision extracts contact details and synthesizes LinkedIn profiles, career history, and company background.
            - **Model Selection & Auto-Fallbacks**: Dynamically list and select from all authorized Gemini models (`gemini-2.0-flash`, `gemini-1.5-flash`, `gemini-1.5-pro`) with self-healing fallbacks.
            - **Follow-up Action Items**: Track per-contact and global action items with priority tags.
            - **Event-Wise Organization**: Filter and organize leads event-wise.
            - **1-Tap Android Contacts Sync**: Export directly to phone contact book via `.vcf` (vCard 3.0).
            - **100% Offline Standalone**: Bundled assets inside the APK run without any laptop or web server.
          files: |
            ./LeadPulse.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
