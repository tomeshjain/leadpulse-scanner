name: Build Wispr Flow Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-keyboard-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Wispr Flow Keyboard APK with Gradle
        working-directory: wispr-flow-keyboard
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            ERROR_OUTPUT=$(grep -C 3 -i "error:" build.log | head -n 60)
            if [ -z "$ERROR_OUTPUT" ]; then
              ERROR_OUTPUT=$(tail -n 60 build.log)
            fi
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$ERROR_OUTPUT" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Keyboard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find wispr-flow-keyboard -name "*.apk" -ls
          APK_FILE=$(find wispr-flow-keyboard -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find wispr-flow-keyboard/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./WisprFlowKeyboard.apk"
          cp "$APK_FILE" ./WisprFlowKeyboard.apk
          ls -lh ./WisprFlowKeyboard.apk

      - name: Upload Keyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WisprFlowKeyboard-APK
          path: ./WisprFlowKeyboard.apk

      - name: Create or Update GitHub Release (Wispr Keyboard v1.4.1)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: wispr-keyboard-v1.4.1
            name: "Wispr Flow - Native Android AI Keyboard Extension (v1.4.1)"
            draft: false
            prerelease: false
            make_latest: true
            body: |
              ## ⌨️ Wispr Flow - Native Android AI Keyboard Extension (v1.4.1)

              **Professional Extended Keyboard Facility for Android with Real Animated GIF Media Insertion, Contextual Text-to-GIF Suggestions, Live & Voice GIF Search, and Rich Curated Reactions Library.**

              ### 🚀 What's New in v1.4.1:
              - **🎞️ True GIF Image Insertion (No Raw URLs)**:
                - Fixed issue where raw web URLs were pasted into chats instead of the actual GIF image.
                - GIFs are downloaded and cached locally, delivered directly as rich content images via `InputConnectionCompat.commitContent()` (with `FileProvider` permissions) across WhatsApp, Telegram, Google Messages, Discord, Slack, and other supported messengers.
                - For apps that don't support direct rich content in text fields, the animated GIF is automatically copied to the clipboard as an image clip so it can be pasted with 1 tap.
              - **🧠 Contextual Text-to-GIF Suggestions**:
                - Typing common conversational keywords (e.g., "applause", "congrats", "cheers", "haha", "celebrate", "awesome", "lol", "love", "thanks", "wow", "good job") automatically suggests a prominent, glowing GIF chip in the top keyboard suggestion bar (`🎞️ GIF: [Title]`).
                - Tapping the suggestion immediately sends the matching GIF image without needing to leave the chat.
              - **🔍 Live Search & Voice Search in GIF Panel**:
                - Added real-time search bar that filters the catalog as you type with zero latency.
                - Debounced live online search powered by Giphy/Tenor for unlimited query discovery.
                - Added **`🎙️ Voice Search`** button to speak any GIF query directly.
                - 10 Quick-tap category pills: `[🔥 Trending]`, `[👏 Applause]`, `[😂 Laugh & Fun]`, `[🎉 Celebrate]`, `[👍 Agree]`, `[🤔 Thinking]`, `[❤️ Love & Thanks]`, `[💼 Work & Hustle]`, `[🐱 Cute Pets]`, `[✨ Kaomoji]`.
              - **🌟 Expanded Best-of-the-Best Curated Catalog**:
                - Over 100 top-rated, high-definition animated reaction GIFs covering all major sentiments and expressions.
            files: |
              ./WisprFlowKeyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

