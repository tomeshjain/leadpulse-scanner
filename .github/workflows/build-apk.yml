name: Build LeadPulse AI Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-keyboard-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build LeadPulse AI Keyboard APK with Gradle
        working-directory: wispr-flow-keyboard
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            ERROR_OUTPUT=$(grep -C 3 -i "error:" build.log | head -n 60)
            if [ -z "$ERROR_OUTPUT" ]; then
              ERROR_OUTPUT=$(tail -n 60 build.log)
            fi
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$ERROR_OUTPUT" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Keyboard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find wispr-flow-keyboard -name "*.apk" -ls
          APK_FILE=$(find wispr-flow-keyboard -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find wispr-flow-keyboard/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./SmartAIKeyboard.apk"
          cp "$APK_FILE" ./SmartAIKeyboard.apk
          cp "$APK_FILE" ./LeadPulseAIKeyboard.apk
          cp "$APK_FILE" ./WisprFlowKeyboard.apk
          ls -lh ./SmartAIKeyboard.apk

      - name: Upload Keyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartAIKeyboard-APK
          path: ./SmartAIKeyboard.apk

      - name: Create or Update GitHub Release (Smart AI v1.6.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: smart-ai-v1.6.0
            name: "Smart AI Keyboard & Executive Meeting Assistant (v1.6.0)"
            draft: false
            prerelease: false
            make_latest: true
            body: |
              ## 🚀 Smart AI Keyboard & Executive Meeting Assistant (v1.6.0)

              **Professional Executive AI Keyboard for Android featuring Glide Animated GIF Engine with Keyboard Typing & Voice Search, Robust Pinned Clipboard History, Meeting & Conversation Mode with Pending Action Items, and Reorganized Compact Toolbar.**

              ### 💎 What's New in v1.6.0:
              - **🌟 Executive Rebranding to Smart AI Keyboard**:
                - Officially branded as **Smart AI Keyboard** with spacebar inscribed `English • Smart AI`.
                - Global-grade typography, subtle micro-haptics, and responsive OS theme integration.
              - **📌 Pinned Clipboard History & Multi-Action Fixes**:
                - **Preserved Pinned Messages**: Clearing history removes *only* unpinned recent clips; pinned favorites are 100% permanently protected.
                - **Dedicated Access Tabs**: Segmented tabs `[⭐ All]`, `[📌 Pinned]`, and `[🕒 Recent]` for instantaneous 1-tap access to your saved snippets.
                - **Reliable Pinning & Deletion**: Toggle pin (`📌` / `☆`) and individual delete (`🗑️`) now refresh the interface with zero delay.
              - **🎞️ Glide Visual Animated GIFs & In-Keyboard Typing Search**:
                - **Actual Moving GIFs**: Visual GIF cards rendered directly in the keyboard via Glide engine instead of plain text/emoji placeholders.
                - **Soft-Keyboard Focus Workaround**: Integrated on-screen typing keypad feeds keystrokes directly into search query without IME focus locks.
                - **🎙️ Instant Voice Search for GIFs**: Tap the mic and speak your query (e.g. "applause", "excited puppy") to search immediately.
                - **Direct Rich Media Dispatch**: Direct file delivery via `commitContent()` into WhatsApp, Telegram, Slack, Messages, etc.
              - **🎙️💬 Meeting & Conversation Recording Mode**:
                - **Manual Start & Stop**: Tap `▶️ Start Conversation` to record continuously; tap `⏹️ Stop & Summarize` when finished.
                - **Live Dialogue Transcript**: Shows the continuous dialogue accumulating in real time.
                - **AI Executive Summary & Action Items**: Gemini AI processes the complete transcript to generate:
                  1. 📋 Executive Summary
                  2. 💡 Key Discussion Points
                  3. ⏳ Pending Action Items (`- [ ] Action item... (Owner, Due)`)
                - **1-Tap Actions**: `📥 Insert All`, `📋 Copy Summary`, and `⏳ Copy Action Items`.
              - **🎨 Reorganized Toolbar & Compact Small Icons**:
                - Compact small icon buttons for `🎙️ Voice` and `📇 Scan Card`.
                - AI Flow Mode selection pill (`✨ Smart Polish ▾`) placed **immediately after** Voice and Scan Card.
                - Dedicated `🎙️💬 Meeting` button right on the top action row.
            files: |
              ./SmartAIKeyboard.apk
              ./LeadPulseAIKeyboard.apk
              ./WisprFlowKeyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

