name: Build Wispr Flow Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-keyboard-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Wispr Flow Keyboard APK with Gradle
        working-directory: wispr-flow-keyboard
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            ERROR_OUTPUT=$(grep -C 3 -i "error:" build.log | head -n 60)
            if [ -z "$ERROR_OUTPUT" ]; then
              ERROR_OUTPUT=$(tail -n 60 build.log)
            fi
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$ERROR_OUTPUT" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Keyboard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find wispr-flow-keyboard -name "*.apk" -ls
          APK_FILE=$(find wispr-flow-keyboard -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find wispr-flow-keyboard/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./WisprFlowKeyboard.apk"
          cp "$APK_FILE" ./WisprFlowKeyboard.apk
          ls -lh ./WisprFlowKeyboard.apk

      - name: Upload Keyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WisprFlowKeyboard-APK
          path: ./WisprFlowKeyboard.apk

      - name: Create or Update GitHub Release (Wispr Keyboard v1.4.0)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: wispr-keyboard-v1.4.0
            name: "Wispr Flow - Native Android AI Keyboard Extension (v1.4.0)"
            draft: false
            prerelease: false
            make_latest: true
            body: |
              ## ⌨️ Wispr Flow - Native Android AI Keyboard Extension (v1.4.0)

              **Professional Extended Keyboard Facility for Android with LinkedIn & Past Work Contact Extraction, Two-Tier Local OCR Fallback, Clean Light Default Live Theming, OS Night Mode Adaptation, and Bottom-Left Navigation Philosophy.**

              ### 🚀 What's New in v1.4.0:
              - **🔗 LinkedIn Profile & Past Work Storage**:
                - Business card scanner intelligently extracts LinkedIn profile URLs and past work/experience details.
                - When saving to phone contacts, details are stored in standard `ContactsContract` fields and combined in the contact notes for universal compatibility across all OEM dialers and contact apps.
              - **🛡️ Two-Tier OCR Fallback Architecture**:
                - If Gemini Multimodal Vision AI is unavailable or offline, the app seamlessly falls back to on-device Google ML Kit Text Recognition.
                - Extracted text is then formatted via Gemini's low-latency text model (`gemini-2.0-flash`), backed by a regex parser for 100% offline situations.
              - **⚡ Low-Latency Unlimited Model**:
                - Default AI model is `gemini-2.0-flash` for high-throughput, low-latency dictation polish and card formatting.
              - **📐 Streamlined Bottom-Left Keyboard Navigation**:
                - In Alphabet (ABC) mode: bottom-left features `?123` (symbols/punctuations) and `123` (pure numbers PIN pad).
                - In Symbols (?123) mode: bottom-left features `ABC` and `123`.
                - In Pure Numbers (123) mode: bottom-left features `ABC` and `?123`.
              - **☀️ Clean Light Default Theme & Settings UI Redesign**:
                - Clean Light is now the default theme out of the box for both keyboard and settings.
                - Complete redesign of the Settings screen with consistent 20dp spacing, 18dp card padding, refined card elevations, and clean typography.
                - Real-time live theme synchronization: selecting any theme in the settings dropdown immediately reskins the entire settings screen and its dropdown adapters.
              - **📱 System-Wide OS Theme & RTL Globalization**:
                - "System Auto" theme dynamically detects OS Dark/Light mode (`UI_MODE_NIGHT_MASK`).
                - Fully supports Right-to-Left (RTL) locales and `Locale.getDefault()` formatting.

              ### 📲 Quick Setup:
              1. Download and install **`WisprFlowKeyboard.apk`** below.
              2. Open the **Wispr Flow** app.
              3. Tap **"1. Enable Wispr Flow in Settings"** and toggle on the keyboard.
              4. Tap **"2. Switch Active Keyboard"** and select **Wispr Flow**.
              5. Tap **"Grant Microphone Permission"** and camera permission for card scanning.
              6. Configure your **Gemini API Key** in Settings for Gemini Vision card extraction and advanced voice polish.
            files: |
              ./WisprFlowKeyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

