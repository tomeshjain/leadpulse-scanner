name: Build Wispr Flow Keyboard APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-keyboard-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Wispr Flow Keyboard APK with Gradle
        working-directory: wispr-flow-keyboard
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --no-daemon 2>&1 | tee ../build.log

      - name: Report Build Logs
        if: always()
        run: |
          echo "### 📋 Build Log Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "build.log" ]; then
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post Failure Details to Commit Comment
        if: failure()
        run: |
          if [ -f "build.log" ]; then
            ERROR_OUTPUT=$(grep -C 3 -i "error:" build.log | head -n 60)
            if [ -z "$ERROR_OUTPUT" ]; then
              ERROR_OUTPUT=$(tail -n 60 build.log)
            fi
            gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="$ERROR_OUTPUT" || true
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Keyboard APK Output
        run: |
          echo "=== Locating APK Files ==="
          find wispr-flow-keyboard -name "*.apk" -ls
          APK_FILE=$(find wispr-flow-keyboard -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file found in build outputs!"
            find wispr-flow-keyboard/app/build -maxdepth 5 || true
            exit 1
          fi
          echo "Copying $APK_FILE to ./WisprFlowKeyboard.apk"
          cp "$APK_FILE" ./WisprFlowKeyboard.apk
          ls -lh ./WisprFlowKeyboard.apk

      - name: Upload Keyboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WisprFlowKeyboard-APK
          path: ./WisprFlowKeyboard.apk

      - name: Create or Update GitHub Release (Wispr Keyboard v1.3.1)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
            tag_name: wispr-keyboard-v1.3.1
            name: "Wispr Flow - Native Android AI Keyboard Extension (v1.3.1)"
            draft: false
            prerelease: false
            make_latest: true
            body: |
              ## ⌨️ Wispr Flow - Native Android AI Keyboard Extension (v1.3.1)

              **Professional Extended Keyboard Facility for Android with Instant Camera Contact Card Scanner, Voice Note Attachments, Native Phone Contacts Integration, and Direct Return to Caller Screen.**

              ### 🚀 What's New in v1.3.1:
              - **🔙 Fixed Navigation - Returns to Caller Screen**:
                - Tapping Close or sending/saving from the Contact Card Scanner now returns directly to the screen where the scanner was clicked (e.g. WhatsApp, Slack, Browser, SMS), rather than returning to SettingsActivity.
                - Implemented isolated task affinity (`com.wisprflow.keyboard.scanner`) with `finishAndRemoveTask()`.
              - **📸 Direct Camera First Experience**:
                - The scanner screen no longer forces you to choose between two large buttons.
                - The camera immediately activates to capture the card right away.
                - A subtle **"🖼️ Gallery"** button is readily accessible in the top header if picking an existing card image.
                - Clean card preview with **"📸 Retake Photo"** option.
              - **📝 Extracted Text Editor**:
                - Live editable display showing all extracted business card details (Name, Title, Company, Phone, Email, Website, Address, Notes).
              - **🎙️ Voice Note Facility for Contact Cards**:
                - Dedicated **"🎙️ Add Voice Note"** button in the extracted information header.
                - Speak quick notes, meeting memos, or follow-up tasks—automatically transcribed and appended into the contact card details (`🎙️ Voice Note: ...`).
              - **💾 Save Contact & Send Card cum Text**:
                - **"💾 Save to Phone Contacts & Send"**: Pre-fills Android's native Contacts app with Name, Phone, Email, Company, Job Title, Address, and Notes/Voice Note with one tap, while simultaneously sending the card text and image into the active chat/field!
                - **"📤 Send Card & Text"**: Directly sends the structured text and image into the chat without saving to phone contacts.
                - **"💾 Save Contact to Phone Only"**: Saves contact into your phone book without inserting into the chat.

              ### 📲 Quick Setup:
              1. Download and install **`WisprFlowKeyboard.apk`** below.
              2. Open the **Wispr Flow** app.
              3. Tap **"1. Enable Wispr Flow in Settings"** and toggle on the keyboard.
              4. Tap **"2. Switch Active Keyboard"** and select **Wispr Flow**.
              5. Tap **"Grant Microphone Permission"** and camera permission for card scanning.
              6. Configure your **Gemini API Key** in Settings for Gemini Vision card extraction and advanced voice polish.
            files: |
              ./WisprFlowKeyboard.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

